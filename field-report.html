}

function addObservation() {
  const r = state.report;
  checkpoint();
  const o = createObservation(r);
  r.observations.push(o);
  renumber(r);
  markDirty();
  renderObservations();
  const cell = $(`tr[data-id="${o.id}"] textarea[data-field="description"]`);
  if (cell) { cell.focus(); cell.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

function observationRow(o) {
  const textCell = (field, label) => h('td', { 'data-label': label },
    h('textarea', {
      class: 'cell-text autogrow', value: o[field], rows: 3, dataset: { field },
      'aria-label': label + ' ' + o.number,
      oninput: (e) => { beginTextEdit('obs:' + o.id + ':' + field); o[field] = e.target.value; markDirty(); },
      onfocusout: endTextEdit,
    }));
  return h('tr', { dataset: { id: o.id } },
    h('td', { class: 'item-cell' },
      h('div', { class: 'item-num' }, o.number),
      h('div', { class: 'pills' }, statusPill(o), tagPills(o)),
      h('div', { class: 'row-controls' },
        h('span', { class: 'drag-handle hover-control', title: 'Drag to reorder', 'aria-label': 'Drag to reorder' }, icon('grip')),
        h('button', {
          type: 'button', class: 'icon-btn danger hover-control', title: 'Delete observation',
          'aria-label': 'Delete observation ' + o.number, onclick: () => deleteItem(o),
        }, icon('trash')))),
    textCell('description', 'Observation'),
    h('td', { 'data-label': 'Supporting Photo' }, photoCell('obs:' + o.id, o.photoIds)),
    textCell('requirement', 'Contract Requirement'));
}

async function deleteItem(item) {
  const r = state.report;
  const inherited = isInherited(item);
  const label = inherited ? item.originalNumber : item.number;
  if (!(await confirmDialog(`Delete item ${label}? You can undo this with Ctrl+Z.`, { ok: 'Delete', danger: true }))) return;
  checkpoint();
  if (inherited) r.inherited = r.inherited.filter((x) => x.id !== item.id);
  else r.observations = r.observations.filter((x) => x.id !== item.id);
  renumber(r);
  markDirty();
  renderObservations();
  renderReminders();
}

function statusPill(item) {
  const inherited = isInherited(item);
  if (item.status === 'complete') {
    const pill = h('button', {
      type: 'button', class: 'pill pill-complete', title: 'Change completion date or mark incomplete',
      onclick: () => showStatusPopover(pill, item),
    }, icon('check'), 'Complete ' + formatDate(item.completedDate));
    return pill;
  }
  const label = inherited ? 'Open from Report ' + pad(item.sourceReport, 2) : 'Incomplete';
  return h('button', {
    type: 'button', class: 'pill ' + (inherited ? 'pill-open' : 'pill-incomplete') + (inherited ? '' : ' hover-control'),
    title: 'Mark complete',
    onclick: () => { checkpoint(); setStatus(item, 'complete', isoDate()); markDirty(); refreshItem(item); },
  }, label);
}

function showStatusPopover(anchor, item) {
  const date = h('input', { type: 'date', value: item.completedDate || isoDate(), 'aria-label': 'Completion date' });
  showPopover(anchor, h('div', null,
    h('div', { class: 'field-label' }, 'Completed on'),
    h('div', { class: 'popover-row' }, date,
      h('button', {
        type: 'button', class: 'btn primary',
        onclick: () => { checkpoint(); setStatus(item, 'complete', date.value || isoDate()); markDirty(); closePopover(); refreshItem(item); },
      }, 'Set')),
    h('hr'),
    h('button', {
      type: 'button', class: 'menu-item',
      onclick: () => { checkpoint(); setStatus(item, 'incomplete'); markDirty(); closePopover(); refreshItem(item); },
    }, 'Mark incomplete')));
}

function tagPills(item) {
  const r = state.report;
  const frag = [];
  for (const id of item.tagIds) {
    const tag = r.tags.find((t) => t.id === id);
    if (!tag) continue;
    const pill = h('button', {
      type: 'button', class: 'pill pill-tag', style: { background: TAG_COLORS[tag.color] || TAG_COLORS.gray },
      title: 'Edit tags', onclick: () => showTagPicker(pill, item),
    }, tag.name);
    frag.push(pill);
  }
  const add = h('button', {
    type: 'button', class: 'pill pill-add hover-control', title: 'Add tag',
    onclick: () => showTagPicker(add, item),
  }, '+ Tag');
  frag.push(add);
  return frag;
}

function colorSwatches(selected, onPick) {
  const wrap = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'Tag color' });
  for (const [name, hex] of Object.entries(TAG_COLORS)) {
    wrap.append(h('button', {
      type: 'button', class: 'swatch', style: { background: hex }, title: name, 'aria-label': name,
      'aria-pressed': String(name === selected),
      onclick: () => {
        $$('.swatch', wrap).forEach((s) => s.setAttribute('aria-pressed', String(s.title === name)));
        onPick(name);
      },
    }));
  }
  return wrap;
}

function showTagPicker(anchor, item) {
  const r = state.report;
  let newColor = 'yellow';
  const name = h('input', { type: 'text', placeholder: 'New tag name', 'aria-label': 'New tag name' });
  const addTag = () => {
    const v = name.value.trim();
    if (!v) return;
    checkpoint();
    let tag = r.tags.find((t) => t.name.toLowerCase() === v.toLowerCase());
    if (!tag) { tag = { id: uuid(), name: v, color: newColor }; r.tags.push(tag); }
    if (!item.tagIds.includes(tag.id)) item.tagIds.push(tag.id);
    markDirty();
    refreshItem(item);
    renderFilterBarInPlace();
    showTagPicker(findItemAnchor(item) || anchor, item);
  };
  name.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addTag(); } });
  showPopover(anchor, h('div', null,
    h('div', { class: 'field-label' }, 'Tags'),
    r.tags.length ? r.tags.map((t) => h('label', { class: 'tag-option' },
      h('input', {
        type: 'checkbox', checked: item.tagIds.includes(t.id),
        onchange: (e) => {
          checkpoint();
          if (e.target.checked) item.tagIds.push(t.id);
          else item.tagIds = item.tagIds.filter((id) => id !== t.id);
          markDirty();
          refreshItem(item);
        },
      }),
      h('span', { class: 'pill pill-tag', style: { background: TAG_COLORS[t.color] } }, t.name)))
      : h('p', { class: 'hint' }, 'No tags yet. Create one below.'),
    h('hr'),
    h('div', { class: 'popover-row' }, name, h('button', { type: 'button', class: 'btn primary', onclick: addTag }, 'Add')),
    h('div', { class: 'popover-row' }, colorSwatches(newColor, (c) => { newColor = c; }))));
  name.focus();
}

function findItemAnchor(item) {
  return $(`[data-id="${item.id}"] .pill-add`);
}

function refreshItem(item) {
  if (isInherited(item)) {
    renderReminders();
  } else {
    const row = $(`#obs-body tr[data-id="${item.id}"]`);
    if (row) {
      const pills = $('.pills', row);
      pills.replaceChildren(statusPill(item), ...tagPills(item));
    }
  }
  applyFilter();
}

/* ==== SECTION: app — render: filters and reminders ==== */

function renderFilterBar() {
  const r = state.report;
  const bar = h('div', { class: 'filter-bar', id: 'filter-bar' });
  if (!r.observations.length && !r.inherited.length) return bar;
  const f = state.filter;
  const statusBtn = (value, label) => h('button', {
    type: 'button', 'aria-pressed': String(f.status === value),
    onclick: () => { f.status = value; renderFilterBarInPlace(); applyFilter(); },
  }, label);
  bar.append(
    h('span', { class: 'field-label' }, 'Show'),
    h('div', { class: 'segmented', role: 'group', 'aria-label': 'Filter by status' },
      statusBtn('all', 'All'), statusBtn('incomplete', 'Incomplete'), statusBtn('complete', 'Complete')));
  if (r.tags.length) {
    bar.append(h('div', { class: 'filter-tags', role: 'group', 'aria-label': 'Filter by tag' },
      h('span', { class: 'field-label' }, 'Tags'),
      r.tags.map((t) => h('button', {
        type: 'button', class: 'pill pill-tag filter-tag', style: { background: TAG_COLORS[t.color] },
        'aria-pressed': String(f.tagIds.includes(t.id)),
        onclick: () => {
          f.tagIds = f.tagIds.includes(t.id) ? f.tagIds.filter((id) => id !== t.id) : [...f.tagIds, t.id];
          renderFilterBarInPlace();
          applyFilter();
        },
      }, t.name))));
  }
  if (f.status !== 'all' || f.tagIds.length) {
    bar.append(h('button', {
      type: 'button', class: 'btn link',
      onclick: () => { state.filter = { status: 'all', tagIds: [] }; renderFilterBarInPlace(); applyFilter(); },
    }, 'Clear filters'));
  }
  return bar;
}

function renderFilterBarInPlace() {
  const bar = $('#filter-bar');
  if (bar) bar.replaceWith(renderFilterBar());
}

function applyFilter() {
  const r = state.report;
  state.filter.tagIds = state.filter.tagIds.filter((id) => r.tags.some((t) => t.id === id));
  for (const row of $$('#obs-body tr, .rem-row')) {
    const item = findObservation(row.dataset.id);
    row.classList.toggle('row-hidden', !!item && !matchesFilter(item, state.filter));
  }
}

function remindersVisible() {
  const r = state.report;
  return r.config.carryForward && r.inherited.length > 0;
}

function renderReminders() {
  const r = state.report;
  const sec = $('#sec-reminders');
  sec.hidden = !remindersVisible();
  if (sec.hidden) { sec.replaceChildren(); return; }
  sec.replaceChildren(
    h('h2', null, 'Open Items from Previous Reports'),
    h('p', { class: 'hint' }, 'Carried forward from earlier reports. Only status and tags can be changed.'),
    ...reminderGroups(r).map((g) => h('div', { class: 'rem-group' },
      h('h3', null, g.title),
      h('table', { class: 'rem-table' },

              'aria-label': 'Delete item ' + o.originalNumber, onclick: () => deleteItem(o),
            }, icon('trash')))))))))));

}

function renderAll() {

/* ==== SECTION: app — sorting and column resize ==== */

function makeSortable(container, { item, handle, onMove }) {
  container.addEventListener('pointerdown', (e) => {
    const grip = e.target.closest(handle);
    if (!grip || e.button > 0) return;
    const el = grip.closest(item);
    if (!el || el.parentElement !== container) return;
    e.preventDefault();
    const indicator = $('#drop-indicator');
    const siblings = [...container.children].filter((c) => c !== el && c.matches(item) && !c.classList.contains('row-hidden'));
    let before;
    el.classList.add('dragging');
    document.body.classList.add('is-sorting');
    grip.setPointerCapture(e.pointerId);

    const onPointerMove = (ev) => {
      if (ev.clientY < 70) scrollBy(0, -14);
      else if (ev.clientY > innerHeight - 70) scrollBy(0, 14);
      before = siblings.find((c) => {
        const rect = c.getBoundingClientRect();
        return ev.clientY < rect.top + rect.height / 2;
      }) || null;
      const cRect = container.getBoundingClientRect();
      const ref = before ? before.getBoundingClientRect() : (siblings.length ? siblings[siblings.length - 1] : el).getBoundingClientRect();
      Object.assign(indicator.style, {
        display: 'block', left: cRect.left + 'px', width: cRect.width + 'px',
        top: ((before ? ref.top : ref.bottom) - 2) + 'px',
      });
    };
    const finish = (commit) => {
      grip.removeEventListener('pointermove', onPointerMove);
      grip.removeEventListener('pointerup', onUp);
      grip.removeEventListener('pointercancel', onCancel);
      el.classList.remove('dragging');
      document.body.classList.remove('is-sorting');
      indicator.style.display = 'none';
      if (commit && before !== undefined) {
        const beforeId = before ? before.dataset.id : null;
        const idx = [...container.children].indexOf(el);
        const next = container.children[idx + 1];
        const unchanged = before === next || (!before && !next);
        if (!unchanged) onMove(el.dataset.id, beforeId);
      }
    };
    const onUp = () => finish(true);
    const onCancel = () => finish(false);
    grip.addEventListener('pointermove', onPointerMove);
    grip.addEventListener('pointerup', onUp);
    grip.addEventListener('pointercancel', onCancel);
  });
}

function initColumnResize(table) {
  const cols = $$('col', table);
  const apply = (widths) => cols.forEach((c, i) => { c.style.width = widths[i] + '%'; });
  $$('.col-resizer', table).forEach((grip, i) => {
    grip.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      grip.setPointerCapture(e.pointerId);
      grip.classList.add('active');
      const startX = e.clientX;
      const start = state.report.ui.columnWidths.slice();
      const total = table.getBoundingClientRect().width;
      let widths = start;
      const move = (ev) => {
        const pair = start[i] + start[i + 1];
        const a = Math.min(pair - 5, Math.max(5, start[i] + ((ev.clientX - startX) / total) * 100));
        widths = start.slice();
        widths[i] = Math.round(a * 10) / 10;
        widths[i + 1] = Math.round((pair - a) * 10) / 10;
        apply(widths);
      };
      const up = () => {
        grip.removeEventListener('pointermove', move);
        grip.classList.remove('active');
        if (widths !== start) { state.report.ui.columnWidths = widths; markDirty(); updatePhotoCaps(); }
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up, { once: true });
    });
    grip.addEventListener('dblclick', () => {
      state.report.ui.columnWidths = DEFAULT_COLUMN_WIDTHS.slice();
      apply(state.report.ui.columnWidths);
      markDirty();
      updatePhotoCaps();
    });
  });
}

/* ==== SECTION: app — photos: import, cells, drag and drop ==== */

const imageCache = new Map();
function loadImage(src) {
  if (!imageCache.has(src)) {
    imageCache.set(src, new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => { imageCache.delete(src); reject(new Error('This image could not be read.')); };
      img.src = src;
    }));
  }
  return imageCache.get(src);
}

async function importImageFile(file) {
  const src = await readFileAsDataURL(file);
  const img = await loadImage(src);
  imageCache.delete(src);
  const scale = Math.min(1, PHOTO_UPLOAD_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  const canvas = h('canvas', { width: Math.round(img.naturalWidth * scale), height: Math.round(img.naturalHeight * scale) });
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const photo = createPhoto(canvas.toDataURL('image/jpeg', PHOTO_UPLOAD_QUALITY), file.name);
  state.report.photos[photo.id] = photo;
  return photo;
}

function photoList(target) {
  const [kind, id] = target.split(':');
  const r = state.report;
  if (kind === 'obs') { const o = r.observations.find((x) => x.id === id); return o && o.photoIds; }
  if (kind === 'gen') { const g = r.generalObservations.find((x) => x.id === id); return g && g.images; }
  return null;
}

async function addPhotosTo(target, files, beforeId = null) {
  const images = [...files].filter((f) => f.type.startsWith('image/'));
  const list = photoList(target);
  if (!images.length || !list) return;
  checkpoint();
  showBusy(images.length > 1 ? `Adding ${images.length} photos…` : 'Adding photo…');
  try {
    for (const file of images) {
      const photo = await importImageFile(file);
      const at = beforeId ? list.indexOf(beforeId) : -1;
      if (at < 0) list.push(photo.id); else list.splice(at, 0, photo.id);
    }
  } catch (err) {
    notify.error('IMAGE_UNREADABLE', { err });
  } finally {
    hideBusy();
    markDirty();
    refreshPhotoCell(target);
  }
}

function photoCellDisplay(target) {
  const [kind, id] = target.split(':');
  const r = state.report;
  const item = kind === 'gen' ? r.generalObservations.find((g) => g.id === id) : findObservation(id);
  return item ? item.display : {};
}

// Screen max height as a multiple of the cell width: the print cap over the print cell width.
function photoCapRatio(kind) {
  const r = state.report;
  return photoMaxHeightIn(r.config, kind) / printPhotoCellWidthIn(r, kind);
}

function updatePhotoCaps() {
  for (const cell of $$('.photo-cell[data-target]')) {
    cell.style.setProperty('--cap-ratio', photoCapRatio(cell.dataset.target.split(':')[0]));
  }
}

function photoCell(target, ids, { readOnly = false, compact = false } = {}) {
  const kind = target.split(':')[0];
  const layout = photoLayout(state.report, kind, photoCellDisplay(target), ids);
  const cell = h('div', {
    class: 'photo-cell' + (compact ? ' compact' : ''), dataset: { target },
    tabindex: readOnly ? null : '0', 'aria-label': readOnly ? null : 'Photos. Drop, paste or click to add.',
  });
  cell.style.setProperty('--cap-ratio', photoCapRatio(kind));
  if (layout.photos.length) {
    cell.append(h('div', { class: 'photo-flow' + (layout.align === 'center' ? ' align-center' : '') },
      layout.photos.map(({ id, width }) => photoFigure(state.report.photos[id], readOnly, width))));
  }
  if (!readOnly) {
    cell.append(ids.length
      ? h('div', { class: 'photo-cell-foot' },
        h('button', { type: 'button', class: 'photo-add', dataset: { pick: target } }, '+ Add photo'),
        h('button', {
          type: 'button', class: 'icon-btn photo-cell-menu hover-control', title: 'Photo size and alignment',
          'aria-label': 'Photo size and alignment', dataset: { cellMenu: target },
        }, icon('more')))
      : h('div', { class: 'photo-empty', dataset: { pick: target } }, icon('image'), h('span', null, 'Drop, paste or click to add photo')));
  }
  return cell;
}

function photoFigure(photo, readOnly, width = 100) {
  const img = h('img', { alt: photo.caption || photo.fileName || 'Photo', draggable: false });
  setPhotoImage(img, photo);
  const fig = h('figure', {
    class: 'photo', dataset: { photoId: photo.id },
    tabindex: readOnly ? null : '0', 'aria-label': readOnly ? null : 'Photo. Press Enter for photo actions.',
  }, img);
  fig.style.setProperty('--w', width);
  trackAspect(img, fig);
  if (!readOnly && state.selectedPhotoId === photo.id) setPhotoSelected(fig, true);
  return fig;
}

// Keep --ar (width / height) on fig in step with the image, for the height cap.
function trackAspect(img, fig) {
  img.addEventListener('load', () => {
    if (img.naturalHeight) fig.style.setProperty('--ar', img.naturalWidth / img.naturalHeight);
  });
}

function setPhotoImage(img, photo) {
  if (!photo.crop && !photo.markup.length) { img.src = photo.original; return; }
  img.src = photo.original;
  flattenPhoto(photo, 1000, 0.85).then((url) => { img.src = url; }).catch((err) => notify.log('warn', 'PREVIEW_FAILED', err));
}

function refreshPhotoCell(target) {
  const cell = $(`.photo-cell[data-target="${target}"]`);
  const list = photoList(target);
  if (cell && list) cell.replaceWith(photoCell(target, list, { compact: cell.classList.contains('compact') }));
}

// Insertion point in a photo flow: the first photo (in reading order) the point is before.
function dropBeforeId(cell, x, y, skipId = null) {
  const fig = $$('.photo', cell).filter((f) => f.dataset.photoId !== skipId).find((f) => {
    const r = f.getBoundingClientRect();
    return y < r.top || (y < r.bottom && x < r.left + r.width / 2);
  });
  return fig ? fig.dataset.photoId : null;
}

function bindPhotoEvents() {
  const page = $('.page');
  page.addEventListener('click', (e) => {
    const menu = e.target.closest('[data-cell-menu]');
    if (menu) return showPhotoCellMenu(menu, menu.dataset.cellMenu);
    const pick = e.target.closest('[data-pick]');
    if (pick) {
      state.pendingPhotoTarget = pick.dataset.pick;
      openFilePicker($('#file-images'));
    }
    return undefined;
  });
  $('#file-images').addEventListener('change', (e) => {
    const target = state.pendingPhotoTarget;
    const files = [...e.target.files];
    e.target.value = '';
    if (target) addPhotosTo(target, files);
  });
  page.addEventListener('pointerover', (e) => {
    const cell = e.target.closest('.photo-cell[tabindex]');
    state.hoverPhotoTarget = cell ? cell.dataset.target : null;
  });
  // Image files dropped from the desktop (photos themselves move by pointer drag).
  page.addEventListener('dragover', (e) => {
    const cell = e.target.closest('.photo-cell[tabindex]');
    if (!cell || !e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    e.stopPropagation();
    e.dataTransfer.dropEffect = 'copy';
    $$('.photo-cell.drag-over').forEach((c) => c !== cell && c.classList.remove('drag-over'));
    cell.classList.add('drag-over');
  });
  page.addEventListener('dragleave', (e) => {
    const cell = e.target.closest('.photo-cell');
    if (cell && !cell.contains(e.relatedTarget)) cell.classList.remove('drag-over');
  });
  page.addEventListener('drop', (e) => {
    const cell = e.target.closest('.photo-cell[tabindex]');
    if (!cell) return;
    e.preventDefault();
    e.stopPropagation();
    cell.classList.remove('drag-over');
    if (e.dataTransfer.files.length) {
      addPhotosTo(cell.dataset.target, e.dataTransfer.files, dropBeforeId(cell, e.clientX, e.clientY));
    }
  });
  document.addEventListener('paste', (e) => {
    const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('.photo-cell[tabindex]');
    const target = focused ? focused.dataset.target : state.hoverPhotoTarget;
    if (!target) return;
    if (!focused && document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    const files = [...(e.clipboardData ? e.clipboardData.files : [])].filter((f) => f.type.startsWith('image/'));
    if (!files.length) return;
    e.preventDefault();
    addPhotosTo(target, files);
  });
  on('photo:changed', ({ photoId }) => {
    const photo = state.report.photos[photoId];
    if (photo) $$(`.photo[data-photo-id="${photoId}"] img`).forEach((img) => setPhotoImage(img, photo));
  });
}

/* ==== SECTION: app — photos: pointer drag ==== */

// One pointer-events drag for mouse, touch and pen. Mouse: drag after a small
// move. Touch/pen: long-press to pick up; moving first scrolls the page.
const PHOTO_LONG_PRESS_MS = 400;
const PHOTO_TOUCH_SLOP = 8;
const PHOTO_MOUSE_SLOP = 5;
const PHOTO_AUTOSCROLL_EDGE = 80;

// Current gesture: { pointerId, pointerType, fig, from, photoId, startX, startY,
// x, y, active, timer, raf, ghost, cell, beforeId }, or null.
let photoDrag = null;

function bindPhotoDrag() {
  const page = $('.page');
  page.addEventListener('pointerdown', (e) => {
    if (photoDrag || e.button > 0 || !e.isPrimary) return;
    const fig = e.target.closest('.photo');
    const cell = fig && fig.closest('.photo-cell[tabindex]');
    if (!cell || fig.classList.contains('cropping') || e.target.closest('button, .photo-handle')) return;
    photoDrag = {
      pointerId: e.pointerId, pointerType: e.pointerType, fig, from: cell.dataset.target, photoId: fig.dataset.photoId,
      startX: e.clientX, startY: e.clientY, x: e.clientX, y: e.clientY, active: false, timer: null,
    };
    if (e.pointerType === 'mouse') e.preventDefault();
    else photoDrag.timer = setTimeout(startPhotoDrag, PHOTO_LONG_PRESS_MS);
    document.addEventListener('pointermove', photoPointerMove);
    document.addEventListener('pointerup', photoPointerUp);
    document.addEventListener('pointercancel', endPhotoGesture);
  });
  // Once a touch drag is active, keep the page from scrolling under it.
  document.addEventListener('touchmove', (e) => { if (photoDrag && photoDrag.active) e.preventDefault(); }, { passive: false });
  // A long-press would otherwise open the image context menu.
  page.addEventListener('contextmenu', (e) => { if (photoDrag && e.target.closest('.photo')) e.preventDefault(); });
}

function photoPointerMove(e) {
  const d = photoDrag;
  if (!d || e.pointerId !== d.pointerId) return;
  d.x = e.clientX;
  d.y = e.clientY;
  if (d.active) {
    e.preventDefault();
    updatePhotoDrag();
    return;
  }
  const moved = Math.hypot(d.x - d.startX, d.y - d.startY);
  if (d.pointerType === 'mouse') { if (moved > PHOTO_MOUSE_SLOP) startPhotoDrag(); }
  else if (moved > PHOTO_TOUCH_SLOP) endPhotoGesture();
}

function startPhotoDrag() {
  const d = photoDrag;
  if (!d || d.active) return;
  clearTimeout(d.timer);
  if (!d.fig.isConnected) { endPhotoGesture(); return; }
  d.active = true;
  try {
    d.fig.setPointerCapture(d.pointerId);
  } catch (err) {
    // Silent: the pointer is already gone; pointerup/cancel ends the gesture.
  }
  d.fig.classList.add('dragging');
  document.body.classList.add('is-sorting');
  const img = $('img', d.fig);
  d.ghost = h('img', { class: 'photo-ghost', src: img.currentSrc || img.src, alt: '' });
  document.body.append(d.ghost);
  if (d.pointerType !== 'mouse' && navigator.vibrate) navigator.vibrate(15);
  document.addEventListener('keydown', photoDragKeydown, true);
  d.raf = requestAnimationFrame(autoScrollPhotoDrag);
  updatePhotoDrag();
}

function updatePhotoDrag() {
  const d = photoDrag;
  d.ghost.style.transform = `translate(${d.x}px, ${d.y}px) translate(-50%, calc(-100% - 12px))`;
  const el = document.elementFromPoint(d.x, d.y);
  const cell = el && el.closest('.photo-cell[tabindex]');
  if (d.cell && d.cell !== cell) d.cell.classList.remove('drag-over');
  d.cell = cell;
  if (!cell) { hidePhotoDropIndicator(); return; }
  cell.classList.add('drag-over');
  d.beforeId = dropBeforeId(cell, d.x, d.y, d.photoId);
  showPhotoDropIndicator(cell, d.beforeId, d.photoId);
}

// A vertical bar on the left edge of `beforeId` (right edge of the last photo when null).
function showPhotoDropIndicator(cell, beforeId, skipId) {
  const figs = $$('.photo', cell).filter((f) => f.dataset.photoId !== skipId);
  let box;
  if (!figs.length) {
    const r = cell.getBoundingClientRect();
    box = { left: r.left + 8, top: r.top + 8, width: r.width - 16, height: 3 };
  } else {
    const fig = beforeId ? figs.find((f) => f.dataset.photoId === beforeId) : figs[figs.length - 1];
    const r = fig.getBoundingClientRect();
    box = { left: (beforeId ? r.left : r.right) - 2, top: r.top - 4, width: 4, height: r.height + 8 };
  }
  Object.assign($('#drop-indicator').style, {
    display: 'block', left: box.left + 'px', top: box.top + 'px', width: box.width + 'px', height: box.height + 'px',
  });
}

function hidePhotoDropIndicator() {
  Object.assign($('#drop-indicator').style, { display: 'none', height: '' });
}

function autoScrollPhotoDrag() {
  const d = photoDrag;
  if (!d || !d.active) return;
  const edge = PHOTO_AUTOSCROLL_EDGE;
  let dy = 0;
  if (d.y < edge) dy = -Math.ceil((edge - d.y) / 5);
  else if (d.y > innerHeight - edge) dy = Math.ceil((d.y - innerHeight + edge) / 5);
  if (dy) { scrollBy(0, dy); updatePhotoDrag(); }
  d.raf = requestAnimationFrame(autoScrollPhotoDrag);
}

function photoDragKeydown(e) {
  if (e.key !== 'Escape') return;
  e.preventDefault();
  e.stopPropagation();
  endPhotoGesture();
}

function photoPointerUp(e) {
  const d = photoDrag;
  if (!d || e.pointerId !== d.pointerId) return;
  endPhotoGesture();
  if (!d.active) selectPhoto(d.photoId);
  else if (d.cell) dropPhoto(d.from, d.cell.dataset.target, d.photoId, d.beforeId);
}

// Ends the gesture without changes (also Escape, pointercancel, or a scroll).
function endPhotoGesture() {
  const d = photoDrag;
  if (!d) return;
  photoDrag = null;
  clearTimeout(d.timer);
  cancelAnimationFrame(d.raf);
  document.removeEventListener('pointermove', photoPointerMove);
  document.removeEventListener('pointerup', photoPointerUp);
  document.removeEventListener('pointercancel', endPhotoGesture);
  document.removeEventListener('keydown', photoDragKeydown, true);
  if (d.ghost) d.ghost.remove();
  if (d.cell) d.cell.classList.remove('drag-over');
  d.fig.classList.remove('dragging');
  document.body.classList.remove('is-sorting');
  hidePhotoDropIndicator();
}

function dropPhoto(from, to, photoId, beforeId) {
  const src = photoList(from);
  const dest = photoList(to);
  if (!src || !dest) return;
  const before = snapshotReport(state.report);
  if (!movePhoto(src, dest, photoId, beforeId)) return;
  checkpoint(before);
  markDirty();
  refreshPhotoCell(from);
  if (to !== from) refreshPhotoCell(to);
}

/* ==== SECTION: app — photos: selection, resize and cell menu ==== */

const PHOTO_CORNERS = ['nw', 'ne', 'sw', 'se'];

// Select one photo (null clears): outline, corner handles and its width.
function selectPhoto(id) {
  state.selectedPhotoId = id;
  for (const fig of $$('.photo-cell[tabindex] .photo')) setPhotoSelected(fig, fig.dataset.photoId === id);
}

function setPhotoSelected(fig, on) {
  fig.classList.toggle('selected', on);
  $$('.photo-handle, .photo-size', fig).forEach((el) => el.remove());
  if (!on) {
    if (floatBar.anchor === fig) hideFloatingToolbar();
    return;
  }
  fig.append(
    ...PHOTO_CORNERS.map((corner) => h('span', { class: 'photo-handle', dataset: { corner }, 'aria-hidden': 'true' })),
    h('span', { class: 'photo-size' }, fig.style.getPropertyValue('--w') + '%'));
  showFloatingToolbar(fig, photoToolbarActions(fig), { label: 'Photo actions' });
}

function photoToolbarActions(fig) {
  const id = fig.dataset.photoId;
  return [
    { name: 'crop', label: 'Crop', icon: 'crop', run: () => startPhotoCrop(fig) },
    { name: 'rotate', label: 'Rotate 90°', icon: 'rotate', run: () => rotatePhoto(id) },
    { name: 'edit', label: 'Edit photo', icon: 'pencil', run: () => openPhotoEditor(id) },
    { name: 'remove', label: 'Remove photo', icon: 'trash', kind: 'danger', run: () => removePhoto(fig.closest('.photo-cell').dataset.target, id) },
  ];
}

function removePhoto(target, photoId) {
  const list = photoList(target);
  if (!list || !list.includes(photoId)) return;
  checkpoint();
  list.splice(list.indexOf(photoId), 1);
  if (state.selectedPhotoId === photoId) state.selectedPhotoId = null;
  markDirty();
  refreshPhotoCell(target);
}

function bindPhotoResize() {
  // Tapping or clicking anywhere else applies a crop and clears the selection.
  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.float-bar')) return;
    if (photoCrop && !photoCrop.fig.contains(e.target)) finishPhotoCrop(true);
    if (state.selectedPhotoId && !e.target.closest('.photo.selected')) selectPhoto(null);
  }, true);
  $('.page').addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.photo-handle');
    if (handle && e.button <= 0) startPhotoResize(e, handle);
  });
  // Keyboard: Enter or Space on a photo selects it and moves focus to its toolbar.
  $('.page').addEventListener('keydown', (e) => {
    const fig = e.target.closest('.photo');
    if (!fig || e.target !== fig || (e.key !== 'Enter' && e.key !== ' ') || fig.classList.contains('cropping')) return;
    e.preventDefault();
    selectPhoto(fig.dataset.photoId);
    requestAnimationFrame(() => { const first = $('#float-bar button'); if (first) first.focus(); });
  });
}

// Drag a corner: width follows the pointer (both edges move when centered),
// snaps via snapPhotoWidth(), and is saved as the photo's override on release.
function startPhotoResize(e, handle) {
  e.preventDefault();
  e.stopPropagation();
  const fig = handle.closest('.photo');
  const flow = fig.parentElement;
  const target = fig.closest('.photo-cell').dataset.target;
  const photo = state.report.photos[fig.dataset.photoId];
  const gap = parseFloat(getComputedStyle(flow).columnGap) || 0;
  const flowWidth = flow.clientWidth;
  const startPct = Number(fig.style.getPropertyValue('--w')) || 100;
  const startWidth = (startPct / 100) * (flowWidth + gap) - gap;
  const sign = handle.dataset.corner.endsWith('e') ? 1 : -1;
  const factor = flow.classList.contains('align-center') ? 2 : 1;
  const label = $('.photo-size', fig);
  let pct = startPct;
  handle.setPointerCapture(e.pointerId);
  const show = (value) => { fig.style.setProperty('--w', value); if (label) label.textContent = value + '%'; };
  const move = (ev) => {
    const width = startWidth + sign * factor * (ev.clientX - e.clientX);
    pct = snapPhotoWidth(((width + gap) / (flowWidth + gap)) * 100);
    show(pct);
  };
  const end = (commit) => {
    handle.removeEventListener('pointermove', move);
    handle.removeEventListener('pointerup', up);
    handle.removeEventListener('pointercancel', cancel);
    if (!commit || pct === startPct) { show(startPct); return; }
    checkpoint();
    photo.display = { ...photo.display, width: pct };
    markDirty();
    refreshPhotoCell(target);
  };
  const up = () => end(true);
  const cancel = () => end(false);
  handle.addEventListener('pointermove', move);
  handle.addEventListener('pointerup', up);
  handle.addEventListener('pointercancel', cancel);
}

// Cell ⋯ menu: default width and alignment, and reset of per-photo widths.
function showPhotoCellMenu(anchor, target) {
  const r = state.report;
  const kind = target.split(':')[0];
  const display = photoCellDisplay(target);
  const cell = cellDisplay(display, kind);
  const overridden = photoList(target).filter((id) => r.photos[id] && validPhotoWidth(r.photos[id].display.width));
  const apply = (change) => {
    checkpoint();
    change();
    markDirty();
    refreshPhotoCell(target);
    const next = $(`.photo-cell[data-target="${target}"] [data-cell-menu]`);
    if (next) showPhotoCellMenu(next, target); else closePopover();
  };
  const choice = (label, options, current, onPick) => [
    h('div', { class: 'field-label' }, label),
    h('div', { class: 'segmented', role: 'group', 'aria-label': label }, options.map(([value, text]) => h('button', {
      type: 'button', 'aria-pressed': String(value === current),
      onclick: () => { if (value !== current) apply(() => onPick(value)); },
    }, text))),
  ];
  showPopover(anchor, h('div', { class: 'photo-menu' },
    choice('Default photo width', PHOTO_WIDTH_STEPS.map((w) => [w, w + '%']), cell.photoWidth,
      (w) => { display.photoWidth = w; }),
    choice('Alignment', [['left', 'Left'], ['center', 'Center']], cell.photoAlign,
      (a) => { display.photoAlign = a; }),
    h('hr'),
    h('button', {
      type: 'button', class: 'menu-item', disabled: !overridden.length,
      onclick: () => apply(() => overridden.forEach((id) => { delete r.photos[id].display.width; })),
    }, 'Reset photos to cell default')));
}

/* ==== SECTION: app — photos: in-cell crop and rotate ==== */

const CROP_MIN_PX = 24;
const CROP_EDGES = ['n', 'e', 's', 'w', 'nw', 'ne', 'sw', 'se'];

// Current in-cell crop: { fig, photo, target, W, H, box }, or null.
let photoCrop = null;
let photoRotating = false;

// Crop mode: the full photo at the photo's current width, the outside dimmed,
// a crop box with corner and edge handles, and a ✓ / ✕ toolbar.
async function startPhotoCrop(fig) {
  const photo = state.report.photos[fig.dataset.photoId];
  if (!photo || photoCrop) return undefined;
  let img;
  try {
    img = await loadImage(photo.original);
  } catch (err) {
    return notify.error('IMAGE_UNREADABLE', { err });
  }
  if (!fig.isConnected || photoCrop) return undefined;
  const W = img.naturalWidth;
  const H = img.naturalHeight;
  photoCrop = {
    fig, photo, target: fig.closest('.photo-cell').dataset.target, W, H,
    box: photo.crop ? { ...photo.crop } : { x: 0, y: 0, w: W, h: H },
  };
  fig.style.width = fig.getBoundingClientRect().width + 'px';
  fig.style.setProperty('--ar', W / H);
  fig.classList.add('cropping');
  $$('.photo-handle, .photo-size', fig).forEach((el) => el.remove());
  const pic = $('img', fig);
  pic.src = photo.original;
  if (photo.markup.length) {
    flattenPhoto({ ...photo, id: photo.id + ':uncropped', crop: null }, 1000, 0.85)
      .then((url) => { if (photoCrop && photoCrop.fig === fig) pic.src = url; })
      .catch((err) => notify.log('warn', 'PREVIEW_FAILED', err));
  }
  fig.append(
    h('div', { class: 'crop-shade' }, h('div', { class: 'crop-window' })),
    h('div', { class: 'crop-box' }, CROP_EDGES.map((edge) => h('span', { class: 'crop-handle', dataset: { edge }, 'aria-hidden': 'true' }))));
  placeCropBox();
  showFloatingToolbar(fig, [
    { name: 'apply', label: 'Apply crop', icon: 'check', kind: 'primary', run: () => finishPhotoCrop(true) },
    { name: 'cancel', label: 'Cancel crop', icon: 'close', run: () => finishPhotoCrop(false) },
  ], { label: 'Crop' });
  return undefined;
}

function placeCropBox() {
  const { fig, W, H, box } = photoCrop;
  const pct = {
    left: (box.x / W) * 100 + '%', top: (box.y / H) * 100 + '%',
    width: (box.w / W) * 100 + '%', height: (box.h / H) * 100 + '%',
  };
  Object.assign($('.crop-window', fig).style, pct);
  Object.assign($('.crop-box', fig).style, pct);
}

// Drag a handle (resize) or the box itself (move); pointercancel reverts.
function startCropDrag(e) {
  const c = photoCrop;
  const el = e.target.closest('.crop-handle') || e.target.closest('.crop-box');
  const edge = el.dataset.edge || 'move';
  e.preventDefault();
  e.stopPropagation();
  const scale = c.W / c.fig.clientWidth;
  const min = Math.min(CROP_MIN_PX * scale, c.W, c.H);
  const start = { ...c.box };
  el.setPointerCapture(e.pointerId);
  const move = (ev) => {
    if (ev.pointerId !== e.pointerId || photoCrop !== c) return;
    c.box = resizeCrop(start, edge, (ev.clientX - e.clientX) * scale, (ev.clientY - e.clientY) * scale, c.W, c.H, min);
    placeCropBox();
  };
  const end = (ev) => {
    if (ev.pointerId !== e.pointerId) return;
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerup', end);
    el.removeEventListener('pointercancel', end);
    if (ev.type === 'pointercancel' && photoCrop === c) { c.box = start; placeCropBox(); }
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

// Leave crop mode; apply writes photo.crop as one undo step when it changed.
function finishPhotoCrop(apply) {
  const c = photoCrop;
  if (!c) return;
  photoCrop = null;
  const crop = normalizeCrop(c.box, c.W, c.H);
  if (apply && JSON.stringify(crop) !== JSON.stringify(c.photo.crop)) {
    checkpoint();
    c.photo.crop = crop;
    markDirty();
  }
  if (floatBar.anchor === c.fig) hideFloatingToolbar();
  refreshPhotoCell(c.target);
}

function bindPhotoCrop() {
  $('.page').addEventListener('pointerdown', (e) => {
    if (photoCrop && e.button <= 0 && e.isPrimary && e.target.closest('.photo.cropping .crop-box')) startCropDrag(e);
  });
}

// Quick rotate: the same 90° clockwise turn as the photo editor, one undo step.
async function rotatePhoto(photoId) {
  const photo = state.report.photos[photoId];
  if (!photo || photoRotating) return;
  photoRotating = true;
  try {
    const img = await loadImage(photo.original);
    const before = snapshotReport(state.report);
    Object.assign(photo, rotatePhotoData(photo, img));
    checkpoint(before);
    markDirty();
    emit('photo:changed', { photoId });
  } catch (err) {
    notify.error('IMAGE_UNREADABLE', { err });
  } finally {
    photoRotating = false;
  }
}

/* ==== SECTION: app — photos: flatten and markup drawing ==== */

const flatCache = new Map();

function flattenPhoto(photo, maxSide, quality) {
  const slot = photo.id + '|' + maxSide;
  const key = [photo.original.length, photo.original.slice(-48), JSON.stringify(photo.crop),
    JSON.stringify(photo.markup), quality].join('|');
  const hit = flatCache.get(slot);
  if (hit && hit.key === key) return hit.promise;
  const entry = { key, value: null, promise: null };
  entry.promise = renderFlattened(photo, maxSide, quality).then((url) => { entry.value = url; return url; });
  flatCache.set(slot, entry);
  return entry.promise;
}

function cachedFlattened(photo, maxSide) {
  const hit = flatCache.get(photo.id + '|' + maxSide);
  return (hit && hit.value) || photo.original;
}

async function renderFlattened(photo, maxSide, quality) {
  const img = await loadImage(photo.original);
  const crop = photo.crop || { x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight };
  const scale = Math.min(1, maxSide / Math.max(crop.w, crop.h));
  const canvas = h('canvas', { width: Math.max(1, Math.round(crop.w * scale)), height: Math.max(1, Math.round(crop.h * scale)) });
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, crop.x, crop.y, crop.w, crop.h, 0, 0, canvas.width, canvas.height);
  const sx = canvas.width / crop.w;
  const sy = canvas.height / crop.h;
  ctx.setTransform(sx, 0, 0, sy, -crop.x * sx, -crop.y * sy);
  drawShapes(ctx, photo.markup);
  return canvas.toDataURL('image/jpeg', quality);
}

function drawShapes(ctx, shapes) {
  for (const s of shapes) drawShape(ctx, s);
}

function textLines(s) {
  return String(s.text || '').split('\n');
}

function drawHaloText(ctx, text, x, y, size, color) {
  ctx.font = `${size}px Arial, sans-serif`;
  ctx.lineWidth = Math.max(2, size / 6);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawShape(ctx, s) {
  ctx.save();
  ctx.strokeStyle = s.color;
  ctx.fillStyle = s.color;
  ctx.lineWidth = s.width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const seg = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  switch (s.type) {
    case 'ellipse':
      ctx.beginPath();
      ctx.ellipse(s.cx, s.cy, Math.max(1, Math.abs(s.rx)), Math.max(1, Math.abs(s.ry)), 0, 0, Math.PI * 2);
      ctx.stroke();
      break;
    case 'line':
      seg(s.x1, s.y1, s.x2, s.y2);
      break;
    case 'arrow': {
      const ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
      const len = s.width * 4 + 8;
      seg(s.x1, s.y1, s.x2 - Math.cos(ang) * len * 0.6, s.y2 - Math.sin(ang) * len * 0.6);
      ctx.beginPath();
      ctx.moveTo(s.x2, s.y2);
      ctx.lineTo(s.x2 - len * Math.cos(ang - 0.42), s.y2 - len * Math.sin(ang - 0.42));
      ctx.lineTo(s.x2 - len * Math.cos(ang + 0.42), s.y2 - len * Math.sin(ang + 0.42));
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'pen':
      if (s.points.length) {
        ctx.beginPath();
        ctx.moveTo(s.points[0][0], s.points[0][1]);
        for (const [x, y] of s.points.slice(1)) ctx.lineTo(x, y);
        if (s.points.length === 1) ctx.lineTo(s.points[0][0] + 0.1, s.points[0][1]);
        ctx.stroke();
      }
      break;
    case 'dimension': {
      const dx = s.x2 - s.x1;
      const dy = s.y2 - s.y1;
      const l = Math.hypot(dx, dy) || 1;
      const nx = -dy / l;
      const ny = dx / l;
      const tick = s.width * 3 + 6;
      seg(s.x1, s.y1, s.x2, s.y2);
      seg(s.x1 - nx * tick, s.y1 - ny * tick, s.x1 + nx * tick, s.y1 + ny * tick);
      seg(s.x2 - nx * tick, s.y2 - ny * tick, s.x2 + nx * tick, s.y2 + ny * tick);
      if (s.label) {
        const size = s.size || s.width * 7 + 10;
        const off = tick + size * 0.7;
        const flip = ny > 0 ? -1 : 1;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        drawHaloText(ctx, s.label, (s.x1 + s.x2) / 2 + nx * off * flip, (s.y1 + s.y2) / 2 + ny * off * flip, size, s.color);
      }
      break;
    }
    case 'text':
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      textLines(s).forEach((line, i) => drawHaloText(ctx, line, s.x, s.y + i * s.size * 1.2, s.size, s.color));
      break;
    default:
      break;
  }
  ctx.restore();
}

function shapeBounds(s, ctx) {
  const box = (xs, ys) => ({ x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) });
  switch (s.type) {
    case 'ellipse': return { x: s.cx - Math.abs(s.rx), y: s.cy - Math.abs(s.ry), w: Math.abs(s.rx) * 2, h: Math.abs(s.ry) * 2 };
    case 'pen': return box(s.points.map((p) => p[0]), s.points.map((p) => p[1]));
    case 'text': {
      ctx.save();
      ctx.font = `${s.size}px Arial, sans-serif`;
      const w = Math.max(10, ...textLines(s).map((line) => ctx.measureText(line).width));
      ctx.restore();
      return { x: s.x, y: s.y, w, h: textLines(s).length * s.size * 1.2 };
    }
    default: return box([s.x1, s.x2], [s.y1, s.y2]);
  }
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  const t = len2 ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2)) : 0;
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function hitShape(s, x, y, tol, ctx) {
  const t = tol + s.width / 2;
  switch (s.type) {
    case 'ellipse': {
      const rx = Math.max(1, Math.abs(s.rx));
      const ry = Math.max(1, Math.abs(s.ry));
      const d = Math.hypot((x - s.cx) / rx, (y - s.cy) / ry);
      return d <= 1 + t / Math.min(rx, ry);
    }
    case 'pen':
      return s.points.some((p, i) => i > 0 && distToSegment(x, y, s.points[i - 1][0], s.points[i - 1][1], p[0], p[1]) <= t)
        || (s.points.length === 1 && Math.hypot(x - s.points[0][0], y - s.points[0][1]) <= t);
    case 'text': {
      const b = shapeBounds(s, ctx);
      return x >= b.x - tol && x <= b.x + b.w + tol && y >= b.y - tol && y <= b.y + b.h + tol;
    }
    default:
      return distToSegment(x, y, s.x1, s.y1, s.x2, s.y2) <= t + (s.type === 'dimension' ? s.width * 3 + 6 : 0);
  }
}

function translateShape(s, dx, dy) {
  if (s.type === 'ellipse') { s.cx += dx; s.cy += dy; }
  else if (s.type === 'pen') s.points = s.points.map(([x, y]) => [x + dx, y + dy]);
  else if (s.type === 'text') { s.x += dx; s.y += dy; }
  else { s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy; }
}

function rotateShape90(s, height, ctx) {
  // Rotates a shape 90° clockwise inside an image of the given original height.
  const rot = (x, y) => [height - y, x];
  if (s.type === 'ellipse') { [s.cx, s.cy] = rot(s.cx, s.cy); [s.rx, s.ry] = [s.ry, s.rx]; }
  else if (s.type === 'pen') s.points = s.points.map(([x, y]) => rot(x, y));
  else if (s.type === 'text') {
    const b = shapeBounds(s, ctx);
    const [cx, cy] = rot(b.x + b.w / 2, b.y + b.h / 2);
    s.x = cx - b.w / 2;
    s.y = cy - b.h / 2;
  } else { [s.x1, s.y1] = rot(s.x1, s.y1); [s.x2, s.y2] = rot(s.x2, s.y2); }
}

// Turn { original, crop, markup } 90° clockwise; img is the decoded original.
// Shared by the photo editor and the in-cell rotate.
function rotatePhotoData(data, img) {
  const W = img.naturalWidth;
  const H = img.naturalHeight;
  const canvas = h('canvas', { width: H, height: W });
  const ctx = canvas.getContext('2d');
  ctx.translate(H, 0);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(img, 0, 0);
  const markup = clone(data.markup);
  markup.forEach((s) => rotateShape90(s, H, ctx));
  return { original: canvas.toDataURL('image/jpeg', PHOTO_UPLOAD_QUALITY), crop: rotateCrop90(data.crop, H), markup };
}

/* ==== SECTION: app — photo editor ==== */

const EDITOR_TOOLS = [
  { tool: 'select', label: 'Select / move', icon: 'select' },
  { tool: 'ellipse', label: 'Circle / ellipse', icon: 'ellipse' },
  { tool: 'arrow', label: 'Arrow', icon: 'arrow' },
  { tool: 'pen', label: 'Freehand pen', icon: 'pen' },
  { tool: 'line', label: 'Line', icon: 'line' },
  { tool: 'dimension', label: 'Dimension', icon: 'dimension' },
  { tool: 'text', label: 'Text', icon: 'text' },
  { tool: 'crop', label: 'Crop', icon: 'crop' },
];
const MARKUP_COLORS = [
  { name: 'Orange', hex: '#F26A21' }, { name: 'Red', hex: '#E02424' }, { name: 'Yellow', hex: '#FFD400' },
  { name: 'White', hex: '#FFFFFF' }, { name: 'Black', hex: '#111111' },
];
const STROKE_FACTORS = [0.004, 0.008, 0.016];

const editor = {
  photoId: null, work: null, img: null, tool: 'select', color: '#F26A21', widthIndex: 1,
  view: { scale: 1, ox: 0, oy: 0 }, selectedId: null, draft: null, cropDraft: null,
  undo: [], redo: [], drag: null, pointers: new Map(), pinch: null, spaceDown: false, frame: 0, textInput: null,
};

function editorIsOpen() {
  return $('#photo-editor').open;
}

function buildEditorToolbar() {
  const bar = $('#pe-bar');
  const btn = (props, ...kids) => h('button', { type: 'button', class: 'pe-btn', ...props }, ...kids);
  bar.replaceChildren(
    h('div', { class: 'pe-group', role: 'toolbar', 'aria-label': 'Tools' },
      EDITOR_TOOLS.map((t) => btn({ title: t.label, 'aria-label': t.label, dataset: { tool: t.tool } }, icon(t.icon)))),
    h('div', { class: 'pe-group', 'aria-label': 'Colors' },
      MARKUP_COLORS.map((c) => h('button', {
        type: 'button', class: 'swatch', style: { background: c.hex }, title: c.name, 'aria-label': c.name, dataset: { color: c.hex },
      }))),
    h('div', { class: 'pe-group', 'aria-label': 'Stroke width' },
      STROKE_FACTORS.map((f, i) => btn({ title: ['Thin', 'Medium', 'Thick'][i], 'aria-label': ['Thin', 'Medium', 'Thick'][i] + ' stroke', dataset: { width: i } },
        h('span', { class: 'pe-width', style: { height: (2 + i * 3) + 'px' } })))),
    h('div', { class: 'pe-group' },
      btn({ title: 'Zoom out', 'aria-label': 'Zoom out', dataset: { cmd: 'zoom-out' } }, icon('zoomOut')),
      btn({ title: 'Zoom in', 'aria-label': 'Zoom in', dataset: { cmd: 'zoom-in' } }, icon('zoomIn')),
      btn({ title: 'Fit to screen', 'aria-label': 'Fit to screen', dataset: { cmd: 'fit' } }, icon('fit')),
      btn({ title: 'Rotate 90°', 'aria-label': 'Rotate 90 degrees', dataset: { cmd: 'rotate' } }, icon('rotate')),
      btn({ title: 'Reset crop', 'aria-label': 'Reset crop', dataset: { cmd: 'reset-crop' } }, icon('resetCrop')),
      btn({ title: 'Delete selected (Delete)', 'aria-label': 'Delete selected shape', dataset: { cmd: 'delete' } }, icon('trash')),
      btn({ title: 'Undo (Ctrl+Z)', 'aria-label': 'Undo', dataset: { cmd: 'undo' } }, icon('undo')),
      btn({ title: 'Redo (Ctrl+Y)', 'aria-label': 'Redo', dataset: { cmd: 'redo' } }, icon('redo'))),
    h('div', { class: 'pe-group pe-actions' },
      h('button', { type: 'button', class: 'btn', dataset: { cmd: 'cancel' } }, 'Cancel'),
      h('button', { type: 'button', class: 'btn primary', dataset: { cmd: 'save' } }, 'Save')));
  bar.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    commitTextInput();
    if (b.dataset.tool) setEditorTool(b.dataset.tool);
    else if (b.dataset.color) setEditorColor(b.dataset.color);
    else if (b.dataset.width) setEditorWidth(Number(b.dataset.width));
    else editorCommand(b.dataset.cmd);
  });

  const canvas = $('#pe-canvas');
  canvas.addEventListener('pointerdown', editorPointerDown);
  canvas.addEventListener('pointermove', editorPointerMove);
  canvas.addEventListener('pointerup', editorPointerUp);
  canvas.addEventListener('pointercancel', editorPointerUp);
  canvas.addEventListener('dblclick', editorDoubleClick);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    zoomEditorAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });
  const dlg = $('#photo-editor');
  dlg.addEventListener('cancel', (e) => { e.preventDefault(); if (!editor.textInput) closePhotoEditor(false); });
  new ResizeObserver(() => { if (editorIsOpen()) { sizeEditorCanvas(); requestEditorRender(); } }).observe($('#pe-stage'));
}

async function openPhotoEditor(photoId) {
  const photo = state.report.photos[photoId];
  if (!photo) return;
  closePopover();
  Object.assign(editor, {
    photoId,
    work: { original: photo.original, crop: clone(photo.crop), markup: clone(photo.markup) },
    tool: 'select', color: state.report.config.markupColor || '#F26A21', widthIndex: 1,
    selectedId: null, draft: null, cropDraft: null, undo: [], redo: [], drag: null, pinch: null,
  });
  editor.pointers.clear();
  try {
    editor.img = await loadImage(photo.original);
  } catch (err) {
    return notify.error('IMAGE_UNREADABLE', { err });
  }
  $('#photo-editor').showModal();
  sizeEditorCanvas();
  fitEditor();
  setEditorTool('select');
  setEditorColor(editor.color);
  setEditorWidth(1);
  updateEditorButtons();
  return undefined;
}

function closePhotoEditor(save) {
  commitTextInput();
  if (save) {
    const photo = state.report.photos[editor.photoId];
    if (photo) {
      const w = editor.work;
      const changed = photo.original !== w.original || JSON.stringify(photo.crop) !== JSON.stringify(w.crop)
        || JSON.stringify(photo.markup) !== JSON.stringify(w.markup);
      if (changed) checkpoint();
      Object.assign(photo, { original: w.original, crop: w.crop, markup: w.markup });
      markDirty();
      emit('photo:changed', { photoId: photo.id });
    }
  }
  $('#photo-editor').close();
  editor.photoId = null;
}

function sizeEditorCanvas() {
  const canvas = $('#pe-canvas');
  const dpr = devicePixelRatio || 1;
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
}

function fitEditor() {
  const canvas = $('#pe-canvas');
  const W = editor.img.naturalWidth;
  const H = editor.img.naturalHeight;
  const scale = Math.min(canvas.clientWidth / W, canvas.clientHeight / H) * 0.94;
  editor.view = { scale, ox: (canvas.clientWidth - W * scale) / 2, oy: (canvas.clientHeight - H * scale) / 2 };
  requestEditorRender();
}

function zoomEditorAt(x, y, factor) {
  const v = editor.view;
  const scale = Math.min(20, Math.max(0.05, v.scale * factor));
  v.ox = x - ((x - v.ox) / v.scale) * scale;
  v.oy = y - ((y - v.oy) / v.scale) * scale;
  v.scale = scale;
  requestEditorRender();
}

function setEditorTool(tool) {
  editor.tool = tool;
  if (tool !== 'select') editor.selectedId = null;
  $$('#pe-bar [data-tool]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tool === tool)));
  $('#pe-stage').classList.toggle('tool-select', tool === 'select');
  const hints = {
    select: 'Click a shape to select it, drag to move. Drag empty space to pan. Double-click text to edit.',
    crop: 'Drag over the photo to set the crop area.',
    text: 'Click where the text should go, type, then press Enter.',
    dimension: 'Drag to draw the dimension line, then type its label.',
  };
  $('#pe-status').textContent = hints[tool] || 'Drag on the photo to draw. Scroll or pinch to zoom; hold Space and drag to pan.';
  updateEditorButtons();
  requestEditorRender();
}

function selectedShape() {
  return editor.work.markup.find((s) => s.id === editor.selectedId) || null;
}

function setEditorColor(hex) {
  editor.color = hex;
  $$('#pe-bar [data-color]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.color.toLowerCase() === hex.toLowerCase())));
  const s = selectedShape();
  if (s && s.color !== hex) { pushEditorUndo(); s.color = hex; requestEditorRender(); }
}

function strokeWidth(index) {
  const longest = Math.max(editor.img.naturalWidth, editor.img.naturalHeight);
  return Math.max(2, Math.round(longest * STROKE_FACTORS[index] * 10) / 10);
}

function setEditorWidth(index) {
  editor.widthIndex = index;
  $$('#pe-bar [data-width]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.width) === index)));
  const s = selectedShape();
  if (s && s.type !== 'text') { pushEditorUndo(); s.width = strokeWidth(index); requestEditorRender(); }
}

function editorSnapshot() {
  return { original: editor.work.original, crop: clone(editor.work.crop), markup: clone(editor.work.markup) };
}

function pushEditorUndo() {
  editor.undo.push(editorSnapshot());
  if (editor.undo.length > HISTORY_LIMIT) editor.undo.shift();
  editor.redo.length = 0;
  updateEditorButtons();
}

async function applyEditorSnapshot(snap) {
  editor.work = snap;
  editor.selectedId = null;
  if (editor.img.src !== snap.original) {
    editor.img = await loadImage(snap.original);
    fitEditor();
  }
  updateEditorButtons();
  requestEditorRender();
}

function updateEditorButtons() {
  const set = (cmd, enabled) => { const b = $(`#pe-bar [data-cmd="${cmd}"]`); if (b) b.disabled = !enabled; };
  set('undo', editor.undo.length > 0);
  set('redo', editor.redo.length > 0);
  set('delete', !!editor.selectedId);
  set('reset-crop', !!(editor.work && editor.work.crop));
}

async function editorCommand(cmd) {
  const canvas = $('#pe-canvas');
  switch (cmd) {
    case 'zoom-in': return zoomEditorAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 1.25);
    case 'zoom-out': return zoomEditorAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 0.8);
    case 'fit': return fitEditor();
    case 'rotate': return rotateEditorPhoto();
    case 'reset-crop':
      if (!editor.work.crop) return undefined;
      pushEditorUndo();
      editor.work.crop = null;
      updateEditorButtons();
      return requestEditorRender();
    case 'delete': return deleteSelectedShape();
    case 'undo':
      if (!editor.undo.length) return undefined;
      editor.redo.push(editorSnapshot());
      return applyEditorSnapshot(editor.undo.pop());
    case 'redo':
      if (!editor.redo.length) return undefined;
      editor.undo.push(editorSnapshot());
      return applyEditorSnapshot(editor.redo.pop());
    case 'cancel': return closePhotoEditor(false);
    case 'save': return closePhotoEditor(true);
    default: return undefined;
  }
}

function deleteSelectedShape() {
  if (!editor.selectedId) return;
  pushEditorUndo();
  editor.work.markup = editor.work.markup.filter((s) => s.id !== editor.selectedId);
  editor.selectedId = null;
  updateEditorButtons();
  requestEditorRender();
}

async function rotateEditorPhoto() {
  pushEditorUndo();
  editor.work = rotatePhotoData(editor.work, editor.img);
  editor.img = await loadImage(editor.work.original);
  fitEditor();
}

function requestEditorRender() {
  if (editor.frame) return;
  editor.frame = requestAnimationFrame(() => { editor.frame = 0; renderEditor(); });
}

function renderEditor() {
  if (!editorIsOpen() || !editor.img) return;
  const canvas = $('#pe-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = devicePixelRatio || 1;
  const { scale, ox, oy } = editor.view;
  const W = editor.img.naturalWidth;
  const H = editor.img.naturalHeight;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1e1f22';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  ctx.drawImage(editor.img, 0, 0);
  drawShapes(ctx, editor.work.markup);
  if (editor.draft) drawShape(ctx, editor.draft);
  const crop = editor.cropDraft || editor.work.crop;
  if (crop) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.rect(crop.x, crop.y, crop.w, crop.h);
    ctx.fill('evenodd');
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5 / scale;
    ctx.setLineDash([6 / scale, 4 / scale]);
    ctx.strokeRect(crop.x, crop.y, crop.w, crop.h);
    ctx.setLineDash([]);
  }
  const sel = selectedShape();
  if (sel) {
    const b = shapeBounds(sel, ctx);
    const pad = 6 / scale + sel.width / 2;
    ctx.strokeStyle = '#4ea1ff';
    ctx.lineWidth = 1.5 / scale;
    ctx.setLineDash([5 / scale, 4 / scale]);
    ctx.strokeRect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2);
    ctx.setLineDash([]);
  }
}

function editorPoint(e) {
  const r = $('#pe-canvas').getBoundingClientRect();
  const { scale, ox, oy } = editor.view;
  return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
}

function hitTestEditor(p) {
  const ctx = $('#pe-canvas').getContext('2d');
  const tol = 8 / editor.view.scale;
  const shapes = editor.work.markup;
  for (let i = shapes.length - 1; i >= 0; i--) if (hitShape(shapes[i], p.x, p.y, tol, ctx)) return shapes[i];
  return null;
}

function newShape(tool, p) {
  const base = { id: uuid(), type: tool, color: editor.color, width: strokeWidth(editor.widthIndex) };
  if (tool === 'ellipse') return { ...base, cx: p.x, cy: p.y, rx: 0, ry: 0 };
  if (tool === 'pen') return { ...base, points: [[p.x, p.y]] };
  if (tool === 'dimension') return { ...base, x1: p.x, y1: p.y, x2: p.x, y2: p.y, label: '', size: Math.round(base.width * 7 + 10) };
  return { ...base, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
}

function editorPointerDown(e) {
  const canvas = $('#pe-canvas');
  // Canvas isn't focusable, so the browser's default mousedown action blurs
  // whatever we just focused (e.g. the text-tool's textarea) right after this
  // handler returns. Prevent that default action to keep the focus we set.
  e.preventDefault();
  commitTextInput();
  canvas.setPointerCapture(e.pointerId);
  editor.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (editor.pointers.size === 2) {
    editor.draft = null;
    editor.cropDraft = null;
    editor.drag = null;
    const [a, b] = [...editor.pointers.values()];
    const r = canvas.getBoundingClientRect();
    editor.pinch = {
      dist: Math.hypot(a.x - b.x, a.y - b.y), mid: { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top },
      view: { ...editor.view },
    };
    return requestEditorRender();
  }
  if (editor.pointers.size > 2) return undefined;
  const p = editorPoint(e);
  const panDrag = { mode: 'pan', sx: e.clientX, sy: e.clientY, ox: editor.view.ox, oy: editor.view.oy };
  if (e.button === 1 || editor.spaceDown) { editor.drag = panDrag; return undefined; }
  switch (editor.tool) {
    case 'select': {
      const hit = hitTestEditor(p);
      editor.selectedId = hit ? hit.id : null;
      editor.drag = hit ? { mode: 'move', last: p, moved: false } : panDrag;
      updateEditorButtons();
      break;
    }
    case 'text': {
      const size = Math.round(strokeWidth(editor.widthIndex) * 7 + 10);
      openTextInput({ id: uuid(), type: 'text', x: p.x, y: p.y, text: '', size, color: editor.color, width: 0 }, 'text', true);
      break;
    }
    case 'crop':
      editor.drag = { mode: 'crop', start: p };
      editor.cropDraft = { x: p.x, y: p.y, w: 0, h: 0 };
      break;
    default:
      editor.drag = { mode: 'draw', start: p };
      editor.draft = newShape(editor.tool, p);
  }
  requestEditorRender();
  return undefined;
}

function editorPointerMove(e) {
  if (!editor.pointers.has(e.pointerId)) return;
  editor.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (editor.pinch && editor.pointers.size === 2) {
    const [a, b] = [...editor.pointers.values()];
    const r = $('#pe-canvas').getBoundingClientRect();
    const mid = { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top };
    const pz = editor.pinch;
    const scale = Math.min(20, Math.max(0.05, pz.view.scale * (Math.hypot(a.x - b.x, a.y - b.y) / (pz.dist || 1))));
    editor.view = {
      scale,
      ox: mid.x - ((pz.mid.x - pz.view.ox) / pz.view.scale) * scale,
      oy: mid.y - ((pz.mid.y - pz.view.oy) / pz.view.scale) * scale,
    };
    return requestEditorRender();
  }
  const d = editor.drag;
  if (!d) return undefined;
  const p = editorPoint(e);
  if (d.mode === 'pan') {
    editor.view.ox = d.ox + (e.clientX - d.sx);
    editor.view.oy = d.oy + (e.clientY - d.sy);
  } else if (d.mode === 'move') {
    const s = selectedShape();
    if (s) {
      if (!d.moved) { pushEditorUndo(); d.moved = true; }
      translateShape(s, p.x - d.last.x, p.y - d.last.y);
      d.last = p;
    }
  } else if (d.mode === 'crop') {
    const W = editor.img.naturalWidth;
    const H = editor.img.naturalHeight;
    const x1 = Math.max(0, Math.min(W, Math.min(d.start.x, p.x)));
    const y1 = Math.max(0, Math.min(H, Math.min(d.start.y, p.y)));
    const x2 = Math.max(0, Math.min(W, Math.max(d.start.x, p.x)));
    const y2 = Math.max(0, Math.min(H, Math.max(d.start.y, p.y)));
    editor.cropDraft = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  } else if (d.mode === 'draw') {
    const s = editor.draft;
    if (s.type === 'ellipse') {
      s.cx = (d.start.x + p.x) / 2;
      s.cy = (d.start.y + p.y) / 2;
      s.rx = Math.abs(p.x - d.start.x) / 2;
      s.ry = Math.abs(p.y - d.start.y) / 2;
    } else if (s.type === 'pen') {
      const last = s.points[s.points.length - 1];
      if (Math.hypot(p.x - last[0], p.y - last[1]) > 2 / editor.view.scale) s.points.push([p.x, p.y]);
    } else {
      s.x2 = p.x;
      s.y2 = p.y;
    }
  }
  requestEditorRender();
  return undefined;
}

function editorPointerUp(e) {
  editor.pointers.delete(e.pointerId);
  if (editor.pinch) {
    if (editor.pointers.size === 0) editor.pinch = null;
    return;
  }
  const d = editor.drag;
  editor.drag = null;
  if (!d) return;
  const minSize = 4 / editor.view.scale;
  if (d.mode === 'draw' && editor.draft) {
    const s = editor.draft;
    editor.draft = null;
    const b = shapeBounds(s, $('#pe-canvas').getContext('2d'));
    if (Math.max(b.w, b.h) >= minSize || s.type === 'pen') {
      pushEditorUndo();
      editor.work.markup.push(s);
      if (s.type === 'dimension') openTextInput(s, 'label', false, true);
    }
  } else if (d.mode === 'crop' && editor.cropDraft) {
    const c = editor.cropDraft;
    editor.cropDraft = null;
    if (c.w >= 10 && c.h >= 10) {
      pushEditorUndo();
      editor.work.crop = { x: Math.round(c.x), y: Math.round(c.y), w: Math.round(c.w), h: Math.round(c.h) };
    }
  }
  updateEditorButtons();
  requestEditorRender();
}

function editorDoubleClick(e) {
  if (editor.tool !== 'select') return;
  const hit = hitTestEditor(editorPoint(e));
  if (hit && hit.type === 'text') openTextInput(hit, 'text', false);
  else if (hit && hit.type === 'dimension') openTextInput(hit, 'label', false);
}

function openTextInput(shape, prop, isNew, justDrawn = false) {
  commitTextInput();
  const { scale, ox, oy } = editor.view;
  let x = shape.x;
  let y = shape.y;
  if (shape.type === 'dimension') { x = (shape.x1 + shape.x2) / 2; y = (shape.y1 + shape.y2) / 2; }
  const fontPx = Math.max(12, shape.size * scale);
  const input = h('textarea', {
    class: 'pe-text-input', rows: 1, value: shape[prop] || '',
    'aria-label': prop === 'label' ? 'Dimension label' : 'Text',
    placeholder: prop === 'label' ? 'Label, e.g. 19"' : 'Type text',
    style: { left: (x * scale + ox) + 'px', top: (y * scale + oy) + 'px', fontSize: fontPx + 'px', color: shape.color },
  });
  editor.textInput = { input, shape, prop, isNew, justDrawn };
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitTextInput(); }
    if (e.key === 'Escape') { e.preventDefault(); input.value = shape[prop] || ''; commitTextInput(); }
  });
  input.addEventListener('blur', () => setTimeout(commitTextInput));
  $('#pe-stage').append(input);
  input.focus();
}

function commitTextInput() {
  const t = editor.textInput;
  if (!t) return;
  editor.textInput = null;
  const value = t.input.value.replace(/\s+$/, '');
  t.input.remove();
  if (t.isNew) {
    if (value) {
      pushEditorUndo();
      t.shape.text = value;
      editor.work.markup.push(t.shape);
      editor.selectedId = t.shape.id;
    }
  } else if (value !== (t.shape[t.prop] || '')) {
    if (!t.justDrawn) pushEditorUndo();
    t.shape[t.prop] = value;
  }
  updateEditorButtons();
  requestEditorRender();
}

function editorKeydown(e) {
  if (editor.textInput) return;
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  if (mod && key === 'z' && !e.shiftKey) { e.preventDefault(); editorCommand('undo'); }
  else if (mod && (key === 'y' || (key === 'z' && e.shiftKey))) { e.preventDefault(); editorCommand('redo'); }
  else if (key === 'delete' || key === 'backspace') { e.preventDefault(); deleteSelectedShape(); }
  else if (key === ' ') { e.preventDefault(); editor.spaceDown = true; $('#pe-stage').classList.add('panning'); }
  else if (key === '+' || key === '=') editorCommand('zoom-in');
  else if (key === '-') editorCommand('zoom-out');
}

function editorKeyup(e) {
  if (e.key === ' ') { editor.spaceDown = false; $('#pe-stage').classList.remove('panning'); }
}

/* ==== SECTION: app — persistence: files ==== */

const FS_ACCESS = typeof window.showOpenFilePicker === 'function' && typeof window.showSaveFilePicker === 'function';
const JSON_PICKER_TYPES = [{ description: 'Field report (JSON)', accept: { 'application/json': ['.json'] } }];

async function confirmDiscard() {
  if (!state.dirty) return true;
  return confirmDialog('This report has unsaved changes. Discard them?', {
    title: 'Unsaved changes', ok: 'Discard changes', cancel: 'Keep editing', danger: true,
  });
}

function pickFileViaInput() {
  return new Promise((resolve) => {
    const input = $('#file-json');
    input.value = '';
    const done = (file) => {
      input.removeEventListener('change', onChange);
      input.removeEventListener('cancel', onCancel);
      resolve(file);
    };
    const onChange = () => done(input.files[0] || null);
    const onCancel = () => done(null);
    input.addEventListener('change', onChange);
    input.addEventListener('cancel', onCancel);
    openFilePicker(input);
  });
}

async function pickJSONFile() {
  if (FS_ACCESS) {
    try {
      const [handle] = await window.showOpenFilePicker({ types: JSON_PICKER_TYPES, multiple: false });
      const file = await handle.getFile();
      return { handle, name: file.name, text: await file.text() };
    } catch (err) {
      if (err.name === 'AbortError') return null;
      // Picker unavailable in this context: fall back to the file input.
      notify.log('info', 'FS_ACCESS_FALLBACK', err);
    }
  }
  const file = await pickFileViaInput();
  return file ? { handle: null, name: file.name, text: await readFileAsText(file) } : null;
}

async function openReportFile(picked) {
  if (!(await confirmDiscard())) return;
  const file = picked || await pickJSONFile();
  if (!file) return;
  try {
    loadReport(parseReport(file.text), { fileHandle: file.handle, fileName: file.name });
    writeAutosave();
    toast('Opened ' + file.name);
  } catch (err) {
    notify.error('OPEN_INVALID_FILE', { err, detail: file.name });
  }
}

async function newReportAction(anchor) {
  if (state.report.config.carryForward) {
    showMenu(anchor, [
      { label: 'Blank report', icon: 'plus', run: newBlankReport },
      { label: 'Next report from previous…', icon: 'folder', run: newReportFromPrevious },
    ]);
  } else {
    newBlankReport();
  }
}

async function newBlankReport() {
  if (!(await confirmDiscard())) return;
  loadReport(createReport({ config: state.report.config, tags: state.report.tags }));
  writeAutosave();
}

async function newReportFromPrevious() {
  if (!(await confirmDiscard())) return;
  const file = await pickJSONFile();
  if (!file) return;
  try {
    const next = nextReportFrom(parseReport(file.text));
    loadReport(next, { dirty: true });
    const n = next.inherited.length;
    toast(`${reportTitle(next)} started. ${n} open item${n === 1 ? '' : 's'} carried forward.`, 4500);
  } catch (err) {
    notify.error('NEXT_REPORT_FAILED', { err, detail: file.name });
  }
}

async function ensureWritePermission(handle) {
  try {
    if (!handle.queryPermission) return true;
    if ((await handle.queryPermission({ mode: 'readwrite' })) === 'granted') return true;
    return (await handle.requestPermission({ mode: 'readwrite' })) === 'granted';
  } catch (err) {
    notify.log('warn', 'WRITE_PERMISSION_FAILED', err);
    return false;
  }
}

function defaultFileName(ext) {
  return (state.fileName ? state.fileName.replace(/\.[^.]+$/, '') : fileBaseName(state.report)) + ext;
}

async function saveReport({ saveAs = false } = {}) {
  closePopover();
  const json = serializeReport(state.report);
  if (FS_ACCESS) {
    try {
      let handle = saveAs ? null : state.fileHandle;
      if (handle && !(await ensureWritePermission(handle))) handle = null;
      if (!handle) {
        handle = await window.showSaveFilePicker({ suggestedName: defaultFileName('.json'), types: JSON_PICKER_TYPES });
      }
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      state.fileHandle = handle;
      state.fileName = handle.name;
      afterSaved('Saved ' + handle.name);
      return true;
    } catch (err) {
      if (err.name === 'AbortError') return false;
      // File System Access refused (e.g. file:// restrictions): fall back to download.
      notify.log('info', 'FS_ACCESS_FALLBACK', err);
    }
  }
  let name = defaultFileName('.json');
  if (saveAs) {
    const chosen = await promptDialog('Save As', 'File name', name);
    if (!chosen) return false;
    name = /\.json$/i.test(chosen) ? chosen : chosen + '.json';
  }
  try {
    downloadBlob(name, new Blob([json], { type: 'application/json' }));
  } catch (err) {
    notify.error('SAVE_FAILED', { err });
    return false;
  }
  state.fileName = name;
  afterSaved('Saved a copy to your Downloads folder: ' + name);
  return true;
}

function afterSaved(message) {
  state.dirty = false;
  state.autosavedCount = -1;
  emit('report:saved', { fileName: state.fileName });
  toast(message);
}

/* ==== SECTION: app — persistence: autosave (IndexedDB) ==== */

const IDB_NAME = 'wm-field-report';
const IDB_STORE = 'autosave';
const IDB_KEY = 'current';

function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    return undefined;
  });
}

async function idbRequest(mode, fn) {
  const db = await idbOpen();
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, mode);
      const req = fn(tx.objectStore(IDB_STORE));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  } finally {
    db.close();
  }
}

async function writeAutosave() {
  if (!state.report || state.autosavedCount === state.changeCount) return;
  const count = state.changeCount;
  const record = {
    savedAt: Date.now(), dirty: state.dirty, fileName: state.fileName,
    fileHandle: state.fileHandle, json: serializeReport(state.report),
  };
  try {
    try {
      await idbRequest('readwrite', (store) => store.put(record, IDB_KEY));
    } catch (err) {
      if (err && err.name !== 'DataCloneError') throw err;
      await idbRequest('readwrite', (store) => store.put({ ...record, fileHandle: null }, IDB_KEY));
    }
    state.autosavedCount = count;
  } catch (err) {
    if (state.autosaveWarned) notify.log('warn', 'AUTOSAVE_WRITE_FAILED', err);
    else notify.warn('STORAGE_UNAVAILABLE', { err });
    state.autosaveWarned = true;
  }
}

async function readAutosave() {
  try {
    return await idbRequest('readonly', (store) => store.get(IDB_KEY));
  } catch (err) {
    notify.log('warn', 'AUTOSAVE_READ_FAILED', err);
    return null;
  }
}

function restartAutosaveTimer() {
  clearInterval(state.autosaveTimer);
  const seconds = Math.max(5, Number(state.report.config.autosaveSeconds) || 30);
  state.autosaveTimer = setInterval(() => { if (state.dirty) writeAutosave(); }, seconds * 1000);
}

async function offerAutosaveRecovery() {
  const rec = await readAutosave();
  if (!rec || !rec.dirty || !rec.json) return;
  const when = new Date(rec.savedAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  const restore = await confirmDialog(`Restore unsaved work from ${when}?`, {
    title: 'Unsaved work found', ok: 'Restore', cancel: 'Start fresh',
  });
  if (!restore) {
    state.autosavedCount = -1;
    return writeAutosave();
  }
  try {
    loadReport(parseReport(rec.json), { fileHandle: rec.fileHandle || null, fileName: rec.fileName || '', dirty: true });
    toast('Unsaved work restored. Remember to Save.');
  } catch (err) {
    notify.error('RESTORE_FAILED', { err });
  }
  return undefined;
}
