/* ==== SECTION: app — export: PDF (print) ==== */

const PRINT_TIP_KEY = 'wm-field-report:print-tip-shown';

function cssString(text) {
  return '"' + String(text).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\r?\n/g, '\\A ') + '"';
}

function updatePageStyle() {
  const r = state.report;
  let style = $('#print-page-style');
  if (!style) { style = h('style', { id: 'print-page-style' }); document.head.append(style); }
  const running = [reportTitle(r), r.header.project, formatDate(r.header.reportDate)].filter(Boolean).join('\n') + '\nPage ';
  style.textContent = `
@page {
  size: letter;
  margin: 1.55in 1in 0.8in 1in;
  @top-left {
    content: ${cssString(running)} counter(page) " of " counter(pages);
    white-space: pre; vertical-align: top; padding-top: 0.6in;
    font-size: 9pt; line-height: 14pt; color: #666;
    font-family: "Franklin Gothic Book", "Libre Franklin", Arial, sans-serif;
  }
}
@page :first {
  margin-top: 0.6in;
  @top-left { content: none; }
  @bottom-center {
    content: ${cssString(r.config.footerText.replace(/\s*\|\s*/g, '     |     '))};
    white-space: pre; vertical-align: bottom; padding-bottom: 0.38in;
    font-size: 7pt; letter-spacing: 0.1em; color: #a6a6a6;
    font-family: "Franklin Gothic Book", "ITC Franklin Gothic Std", "Libre Franklin", Arial, sans-serif;
  }
}`;
}

function printPhotoIds() {
  const r = state.report;
  return [...r.generalObservations.flatMap((g) => g.images), ...r.observations.flatMap((o) => o.photoIds)]
    .filter((id) => r.photos[id]);
}

function printPill(text, cls, bg) {
  return h('span', { class: 'pr-pill ' + (cls || ''), style: bg ? { background: bg } : null }, text);
}

function printPhotoFlow(kind, display, ids, urlFor) {
  const layout = photoLayout(state.report, kind, display, ids);
  if (!layout.photos.length) return null;
  const flow = h('div', { class: 'pr-flow' + (layout.align === 'center' ? ' align-center' : '') },
    layout.photos.map(({ id, width }) => {
      const img = h('img', { alt: '' });
      const fig = h('span', { class: 'pr-fig' }, img);
      fig.style.setProperty('--w', width);
      trackAspect(img, fig);
      img.src = urlFor(id);
      return fig;
    }));
  flow.style.setProperty('--cap', layout.maxHeightIn + 'in');
  return flow;
}

function printItemPills(item, { status = true } = {}) {
  const r = state.report;
  const pills = [];
  if (status && r.config.pdfShowStatus) {
    pills.push(item.status === 'complete'
      ? printPill('Complete ' + formatDate(item.completedDate), 'complete')
      : printPill('Incomplete'));
  }
  if (r.config.pdfShowTags) {
    for (const id of item.tagIds) {
      const t = r.tags.find((x) => x.id === id);
      if (t) pills.push(printPill(t.name, '', TAG_COLORS[t.color]));
    }
  }
  return pills.length ? h('div', { class: 'pr-pills' }, pills) : null;
}

function renderPrint(urlFor) {
  const r = state.report;
  const c = r.config;
  const hd = r.header;
  const field = (col, label, value) => h('div', { class: 'pr-field pr-c' + col },
    h('span', null, label + ':'), h('span', { class: 'pr-value' }, value || ''));
  const root = $('#print-root');
  root.replaceChildren(...[
    h('div', { class: 'pr-first' },
      h('div', { class: 'pr-masthead' },
        h('img', { class: 'pr-logo', src: c.logo || DEFAULT_LOGO, alt: '' }),
        h('div', { class: 'pr-tagline' }, c.mastheadTagline)),
      h('h1', { class: 'pr-title' }, reportTitle(r).toUpperCase()),
      h('div', { class: 'pr-head' },
        field(1, 'By', hd.author), field(2, 'Purpose', hd.purpose), field(3, 'Report Date', formatDate(hd.reportDate)),
        field(1, 'Visit Date', formatDate(hd.visitDate)), field(2, 'Project', hd.project), field(3, 'Project No.', hd.projectNumber),
        h('div', { class: 'pr-gap' }),
        field(1, 'Time', hd.time), field(2, 'Weather', hd.weather), field(3, 'Distribution', hd.distribution.join(', ')),
        field(1, 'Attendees', hd.attendees.join(', '))),
      h('p', { class: 'pr-disclaimer' }, r.disclaimer),
      h('div', { class: 'pr-general' },
        h('h2', null, 'General Observations/Comments'),
        r.generalObservations.length ? h('ol', null, r.generalObservations.map((g) => h('li', null,
          h('p', null, g.text),
          printPhotoFlow('gen', g.display, g.images, urlFor))))
          : null)),
    r.observations.length ? h('table', { class: 'pr-table' },
      h('colgroup', null, printColumnWidths(r).map((w) => h('col', { style: { width: w + '%' } }))),
      h('thead', null, h('tr', null, COLUMN_LABELS.map((t) => h('th', null, t)))),
      h('tbody', null, r.observations.map((o) => h('tr', null,
        h('td', { class: 'pr-item' }, o.number, printItemPills(o)),
        h('td', null, o.description),
        h('td', { class: 'pr-photo' }, printPhotoFlow('obs', o.display, o.photoIds, urlFor)),
        h('td', null, o.requirement))))) : null,
    remindersVisible() && c.pdfShowReminders ? h('section', { class: 'pr-reminders' },
      h('h2', null, 'Open Items from Previous Reports'),
      reminderGroups(r).map((g) => [
        h('h3', null, g.title),
        h('table', { class: 'pr-rem-table' },
          h('colgroup', null, [8, 38, 33, 21].map((w) => h('col', { style: { width: w + '%' } }))),
          h('thead', null, h('tr', null, ['Item', 'Observation', 'Contract Requirement', 'Status'].map((t) => h('th', null, t)))),
          h('tbody', null, g.items.map((o) => h('tr', null,
            h('td', null, o.originalNumber, printItemPills(o, { status: false })),
            h('td', null, o.description),
            h('td', null, o.requirement),
            h('td', null, o.status === 'complete' ? printPill('Complete ' + formatDate(o.completedDate), 'complete') : printPill('Open', 'open')))))),
      ])) : null,
  ].filter(Boolean));
  updatePageStyle();
}

async function preparePrint() {
  const r = state.report;
  const { photoExportMaxSide: size, photoExportQuality: quality } = r.config;
  const urls = new Map();
  await Promise.all(printPhotoIds().map(async (id) => {
    urls.set(id, await flattenPhoto(r.photos[id], size, quality));
  }));
  renderPrint((id) => urls.get(id));
  await Promise.all($$('#print-root img').map((img) => img.decode().catch((err) => notify.log('warn', 'PREVIEW_FAILED', err))));
  state.printPrepared = true;
}

async function showPrintTip() {
  if (safeLocalGet(PRINT_TIP_KEY)) return true;
  const value = await modal({
    title: 'Saving as PDF',
    body: [
      h('p', null, 'In the print window that opens next:'),
      h('ol', null,
        h('li', null, 'Set Destination to “Save as PDF”.'),
        h('li', null, 'Open “More settings”, turn Headers and footers off.'),
        h('li', null, 'Turn Background graphics on.')),
      h('p', { class: 'hint' }, 'This tip is shown once.'),
    ],
    buttons: [{ label: 'Continue', value: 'ok', kind: 'primary' }, { label: 'Cancel', value: 'cancel' }],
  });
  if (value !== 'ok') return false;
  safeLocalSet(PRINT_TIP_KEY, '1');
  return true;
}

async function exportPDF() {
  closePopover();
  if (!(await showPrintTip())) return;
  renumber(state.report);
  showBusy('Preparing PDF…');
  try {
    await preparePrint();
  } catch (err) {
    hideBusy();
    return notify.error('PDF_PREPARE_FAILED', { err });
  }
  hideBusy();
  document.title = defaultFileName('');
  state.printOpened = false;
  const mark = expectBrowserWindow(2000, () => {
    if (state.printOpened) return;
    document.title = 'Field Observation Report';
    notify.error('PRINT_UNAVAILABLE');
  });
  window.print();
  if (state.printOpened) mark();
  return undefined;
}

function bindPrintEvents() {
  window.addEventListener('beforeprint', () => {
    state.printOpened = true;
    if (state.printPrepared) return;
    // Printed from the browser menu: build synchronously from cached photos.
    const size = state.report.config.photoExportMaxSide;
    renderPrint((id) => cachedFlattened(state.report.photos[id], size));
    document.title = defaultFileName('');
  });
  window.addEventListener('afterprint', () => {
    document.title = 'Field Observation Report';
    state.printPrepared = false;
  });
}

/* ==== SECTION: app — config panel ==== */

function setConfig(key, value) {
  const c = state.report.config;
  if (c[key] === value) return;
  if (key === 'disclaimer' && state.report.disclaimer === c.disclaimer) state.report.disclaimer = value;
  c[key] = value;
  markDirty();
  emit('config:changed', { key });
}

function configToggle(label, key, hint) {
  return h('label', { class: 'toggle' },
    h('span', null, label, hint && h('div', { class: 'hint' }, hint)),
    h('input', { type: 'checkbox', checked: !!state.report.config[key], onchange: (e) => setConfig(key, e.target.checked) }));
}

function configRange(label, key, { min, max, step, format }) {
  const out = h('output', null, format(state.report.config[key]));
  return h('div', { class: 'field' },
    h('span', { class: 'field-label' }, label),
    h('div', { class: 'range-row' },
      h('input', {
        type: 'range', min, max, step, value: state.report.config[key], 'aria-label': label,
        oninput: (e) => { const v = Number(e.target.value); out.textContent = format(v); setConfig(key, v); },
      }), out));
}

function configText(label, key, { multiline = false, hint } = {}) {
  const props = {
    value: state.report.config[key], 'aria-label': label,
    oninput: (e) => setConfig(key, e.target.value),
  };
  return h('label', { class: 'field' },
    h('span', { class: 'field-label' }, label),
    multiline ? h('textarea', { ...props, class: 'autogrow', rows: 4 }) : h('input', { ...props, type: 'text' }),
    hint && h('span', { class: 'hint' }, hint));
}

function numberingField() {
  const c = state.report.config;
  const preset = NUMBERING_PRESETS.find((p) => p.pattern === c.numberingPattern);
  const custom = h('input', {
    type: 'text', value: c.numberingPattern, 'aria-label': 'Custom numbering pattern', hidden: !!preset,
    oninput: (e) => setConfig('numberingPattern', e.target.value),
  });
  const example = h('span', { class: 'hint' });
  const updateExample = () => {
    example.textContent = 'Example: ' + formatItemNumber(c.numberingPattern, state.report.header.reportNumber, Number(c.numberingStart) || 1)
      + '. Tokens: {report}, {item}; add :02 to pad or :A for letters.';
  };
  updateExample();
  const select = h('select', {
    'aria-label': 'Numbering format',
    onchange: (e) => {
      if (e.target.value === 'custom') { custom.hidden = false; custom.focus(); return; }
      custom.hidden = true;
      custom.value = e.target.value;
      setConfig('numberingPattern', e.target.value);
      updateExample();
    },
  },
  NUMBERING_PRESETS.map((p) => h('option', { value: p.pattern, selected: p === preset }, p.label)),
  h('option', { value: 'custom', selected: !preset }, 'Custom pattern…'));
  custom.addEventListener('input', updateExample);
  return h('div', { class: 'field' },
    h('span', { class: 'field-label' }, 'Numbering format'), select, custom, example,
    h('label', { class: 'field' }, h('span', { class: 'field-label' }, 'Start numbering at'),
      h('input', {
        type: 'number', min: 0, value: c.numberingStart, 'aria-label': 'Start numbering at',
        oninput: (e) => { setConfig('numberingStart', Math.max(0, Math.floor(Number(e.target.value)) || 0)); updateExample(); },
      })));
}

function tagsEditor() {
  const r = state.report;
  const wrap = h('div', { class: 'field', id: 'config-tags' });
  const rerender = () => { wrap.replaceWith(tagsEditor()); renderObservations(); renderReminders(); };
  r.tags.forEach((t) => {
    wrap.append(h('div', { class: 'tag-row' },
      h('span', { class: 'swatch', style: { background: TAG_COLORS[t.color] }, 'aria-hidden': 'true' }),
      h('input', {
        type: 'text', value: t.name, 'aria-label': 'Tag name',
        onchange: (e) => { const v = e.target.value.trim(); if (!v) return; checkpoint(); t.name = v; markDirty(); rerender(); },
      }),
      h('select', {
        'aria-label': 'Tag color',
        onchange: (e) => { checkpoint(); t.color = e.target.value; markDirty(); rerender(); },
      }, Object.keys(TAG_COLORS).map((name) => h('option', { value: name, selected: name === t.color }, name))),
      h('button', {
        type: 'button', class: 'icon-btn danger', 'aria-label': 'Delete tag ' + t.name, title: 'Delete tag',
        onclick: async () => {
          const used = tagUsage(r, t.id);
          if (used && !(await confirmDialog(`Remove “${t.name}” from ${used} item${used === 1 ? '' : 's'} and delete it?`, { ok: 'Delete tag', danger: true }))) return;
          checkpoint();
          deleteTag(r, t.id);
          markDirty();
          rerender();
        },
      }, icon('trash'))));
  });
  wrap.append(h('button', {
    type: 'button', class: 'btn', onclick: () => {
      checkpoint();
      r.tags.push({ id: uuid(), name: 'New tag', color: Object.keys(TAG_COLORS)[r.tags.length % 8] });
      markDirty();
      rerender();
      const inputs = $$('#config-tags input[type=text]');
      inputs[inputs.length - 1].select();
    },
  }, icon('plus'), 'Add tag'));
  return wrap;
}

function logoEditor() {

}

      logoEditor(),

    section('Autosave',
      h('label', { class: 'field' }, h('span', { class: 'field-label' }, 'Autosave every (seconds)'),
        h('input', {
          type: 'number', min: 5, value: state.report.config.autosaveSeconds,
          oninput: (e) => setConfig('autosaveSeconds', Math.max(5, Math.floor(Number(e.target.value)) || 30)),
        }))),
    section('Troubleshooting',
      h('p', { class: 'hint' }, 'Copies browser details and a log of recent problems to send to a maintainer. '
        + 'It never includes report content or photos.'),
      h('button', { type: 'button', class: 'btn', onclick: copyDebugInfo }, 'Copy debug info')));
}

/* ==== SECTION: app — keyboard, window events and init ==== */

function bindGlobalEvents() {
  document.addEventListener('keydown', (e) => {
    if (editorIsOpen()) return editorKeydown(e);
    if ($('#dlg').open) return undefined;
    const mod = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();
    if (photoCrop && (key === 'escape' || (key === 'enter' && !e.target.closest('button, input, textarea, select')))) {
      e.preventDefault();
      finishPhotoCrop(key === 'enter');
    } else if (mod && key === 's') { e.preventDefault(); saveReport({ saveAs: e.shiftKey }); }
    else if (mod && key === 'p') { e.preventDefault(); exportPDF(); }
    else if (mod && key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (mod && (key === 'y' || (key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    else if (key === 'escape') { closePopover(); closeConfig(); selectPhoto(null); }
    return undefined;
  });
  document.addEventListener('keyup', (e) => { if (editorIsOpen()) editorKeyup(e); });

  window.addEventListener('resize', placeFloatingToolbar);
  window.addEventListener('beforeunload', (e) => {
    if (!state.dirty) return;
    writeAutosave();
    e.preventDefault();
    e.returnValue = '';
  });
  window.addEventListener('blur', () => { if (state.dirty) writeAutosave(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state.dirty) writeAutosave(); });

  // Dropping a report file anywhere outside a photo cell opens it.
  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  document.addEventListener('dragenter', (e) => { if (hasFiles(e)) { dragDepth++; document.body.classList.add('drop-file'); } });
  document.addEventListener('dragleave', (e) => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('drop-file'); } });
  document.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  document.addEventListener('drop', (e) => {
    dragDepth = 0;
    document.body.classList.remove('drop-file');
    if (!hasFiles(e)) return;
    e.preventDefault();
    const file = [...e.dataTransfer.files].find((f) => /\.json$/i.test(f.name) || f.type === 'application/json');
    if (!file) return;
    file.text().then((text) => openReportFile({ handle: null, name: file.name, text }))
      .catch((err) => notify.error('OPEN_INVALID_FILE', { err, detail: file.name }));
  });

  $('#file-logo').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      setConfig('logo', await readFileAsDataURL(file));
    } catch (err) {
      notify.error('IMAGE_UNREADABLE', { err, detail: file.name });
      return;
    }
    const logo = $('#config-logo');
    if (logo) logo.replaceWith(logoEditor());
  });

  on('report:loaded', () => { renderAll(); restartAutosaveTimer(); });
  on('report:changed', updateChrome);
  on('report:saved', () => { updateChrome(); writeAutosave(); });
  on('config:changed', ({ key }) => {
    if (key === 'numberingPattern' || key === 'numberingStart' || key === '*') { renumber(state.report); renderObservations(); }
    if (key === 'carryForward' || key === '*') { renderObservations(); renderReminders(); }
    if (key === 'disclaimer' || key === '*') renderHeader();
    if (key === 'autosaveSeconds' || key === '*') restartAutosaveTimer();
    if (/^(photoMaxHeight|pdfUseScreenWidths$)/.test(key) || key === '*') updatePhotoCaps();
  });
}

function init() {
  window.addEventListener('error', (e) => {
    const where = `${e.message} (${e.filename}:${e.lineno}:${e.colno})`;
    // Chrome reports this harmless ResizeObserver notice as an error; log it only.
    if (/ResizeObserver loop/.test(e.message)) return notify.log('info', 'RESIZE_OBSERVER_LOOP', where);
    return reportUncaught(e.error, where);
  });
  window.addEventListener('unhandledrejection', (e) => reportUncaught(e.reason, 'Unhandled rejection'));
  detectCapabilities();
  buildToolbar();
  buildEditorToolbar();
  bindGlobalEvents();
  bindPhotoEvents();
  bindPhotoDrag();
  bindPhotoResize();
  bindPhotoCrop();
  bindPrintEvents();
  loadReport(createReport());
  showEnvironmentNotice();
  document.documentElement.dataset.ready = 'true';
  offerAutosaveRecovery();
}

init();
