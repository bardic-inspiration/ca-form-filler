name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Zero-dependency checks (AGENTS.md §5): nothing to install, runs on every
  # change, docs included, because the lint also checks DEVELOPER.md.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint
        run: node tools/lint.mjs

      - name: Test (core logic + headless Chrome smoke test)
        run: node --test
        env:
          CHROME_PATH: google-chrome
